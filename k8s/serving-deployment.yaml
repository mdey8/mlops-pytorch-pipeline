apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-deployment
  labels:
    app: model-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
      - name: serving-container
        image: serving-image:latest  
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: checkpoint-volume
          mountPath: /app/checkpoints
          readOnly: true
      volumes:
      - name: checkpoint-volume
        persistentVolumeClaim:
          claimName: checkpoints-pvc  